name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y liblmdb-dev autoconf automake libtool pkg-config build-essential git ca-certificates

      - name: Build IOHK libsodium (VRF)
        run: |
          git clone --depth 1 --branch draft-irtf-cfrg-vrf-03 https://github.com/intersectmbo/libsodium.git /tmp/libsodium
          cd /tmp/libsodium
          ./autogen.sh -f
          ./configure --prefix=/usr/local
          make -j$(nproc)
          sudo make install
          sudo ldconfig
          nm -D /usr/local/lib/libsodium.so | grep crypto_vrf_ietfdraft03_prove

      - name: Install Zig 0.15.2
        run: |
          ZIG_VER=0.15.2
          curl -L "https://ziglang.org/download/${ZIG_VER}/zig-x86_64-linux-${ZIG_VER}.tar.xz" -o zig.tar.xz
          tar -xf zig.tar.xz
          sudo mv "zig-x86_64-linux-${ZIG_VER}" /opt/zig
          echo "/opt/zig" >> $GITHUB_PATH

      - name: Build (ReleaseSafe)
        working-directory: tsunagi-node
        run: |
          zig version
          zig build -Doptimize=ReleaseSafe

      - name: Smoke test
        working-directory: tsunagi-node
        run: |
          ./zig-out/bin/tsunagi-node || true
