<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mempool Observatory — TSUNAGI Labs</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
--bg:#05080e;--bg-surface:#0a0f1a;--bg-card:rgba(12,18,30,0.65);
--border:rgba(80,120,180,0.10);--border-hover:rgba(80,120,180,0.28);
--border-accent:rgba(80,140,220,0.35);
--text:#d0d6e2;--text-m:#7a8598;--text-d:#4c5668;
--accent:#3d6fa8;--accent-l:#5a8ec8;--white:#eceef3;
--green:#3da86f;--red:#a83d3d;--amber:#a89b3d;
--yellow:#a89b3d;--yellow-bg:rgba(168,155,61,0.08);--yellow-border:rgba(168,155,61,0.25);
--mono:'SF Mono','Cascadia Code','Fira Code','Consolas',monospace;
--sans:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',Helvetica,Arial,sans-serif;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;}

.ub{position:fixed;top:0;left:0;right:0;z-index:100;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:rgba(5,8,14,0.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);}
.ub-l{display:flex;align-items:center;gap:20px;}
.ub-brand{font-size:0.82rem;font-weight:700;letter-spacing:0.14em;color:var(--white);text-decoration:none;}
.ub-nav{display:flex;gap:6px;flex-wrap:wrap;}
.ub-nav a{font-size:0.75rem;font-weight:500;letter-spacing:0.03em;color:var(--text-m);text-decoration:none;padding:5px 12px;border-radius:4px;border:1px solid transparent;transition:all 0.2s;}
.ub-nav a:hover{color:var(--white);border-color:var(--border-accent);background:rgba(60,112,180,0.08);}

.pg{max-width:960px;margin:0 auto;padding:80px 28px 60px;}

/* ── Header ── */
.hdr{text-align:center;margin-bottom:36px;}
.hdr h1{font-size:1.5rem;font-weight:700;color:var(--white);letter-spacing:0.04em;margin-bottom:8px;}
.hdr p{font-size:0.85rem;color:var(--text-m);}

/* ── Summary Strip ── */
.summary{display:flex;gap:14px;margin-bottom:28px;flex-wrap:wrap;}
.sum-card{flex:1;min-width:120px;background:var(--bg-card);border:1px solid var(--border);border-radius:6px;padding:14px 16px;text-align:center;}
.sum-label{font-family:var(--mono);font-size:0.58rem;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-d);margin-bottom:4px;}
.sum-val{font-family:var(--mono);font-size:1.1rem;font-weight:700;color:var(--white);}

/* ── Section ── */
.section-label{font-family:var(--mono);font-size:0.62rem;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent-l);margin-bottom:14px;padding-bottom:8px;border-bottom:1px solid var(--border);}

/* ── Table ── */
.mp-table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:0.78rem;}
.mp-table th{font-size:0.6rem;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-d);text-align:right;padding:7px 10px;border-bottom:1px solid var(--border);}
.mp-table th:first-child{text-align:left;}
.mp-table td{padding:6px 10px;border-bottom:1px solid rgba(80,120,180,0.06);color:var(--text);text-align:right;}
.mp-table td:first-child{text-align:left;color:var(--accent-l);}
.mp-table tr:hover td{background:rgba(60,112,180,0.04);}
.mp-meta-y{color:var(--amber);}
.mp-meta-n{color:var(--text-d);}
.mp-empty{font-size:0.85rem;color:var(--text-d);padding:20px 0;}

/* ── Refresh ── */
.refresh-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.refresh-ind{font-family:var(--mono);font-size:0.65rem;color:var(--text-d);}
.refresh-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:6px;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

/* ── Footer ── */
.ft{text-align:center;padding:40px 0 32px;border-top:1px solid var(--border);margin-top:48px;}
.ft p{font-size:0.78rem;color:var(--text-d);letter-spacing:0.03em;}

@media(max-width:768px){.ub-nav{display:none;}.pg{padding:70px 18px 40px;}.summary{flex-direction:column;}}
</style>
</head>
<body>

<div class="ub">
  <div class="ub-l"><a href="/" class="ub-brand">TSUNAGI</a></div>
  <nav class="ub-nav">
    <a href="/">Home</a>
    <a href="/explorer/">Explorer</a>
    <a href="/decode/">Decode</a>
    <a href="/status/">Status</a>
    <a href="/labs/">Labs</a>
  </nav>
</div>

<div class="pg">

  <div class="hdr">
    <h1>Mempool Observatory</h1>
    <p>Live decoded transaction summaries from the submission path</p>
  </div>

  <!-- Summary -->
  <div class="summary">
    <div class="sum-card">
      <div class="sum-label">Total Seen</div>
      <div class="sum-val" id="mp-total">&mdash;</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">Last Seen</div>
      <div class="sum-val" id="mp-last">&mdash;</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">Network</div>
      <div class="sum-val" id="mp-net">&mdash;</div>
    </div>
  </div>

  <!-- Recent Transactions -->
  <div class="refresh-bar">
    <div class="section-label" style="margin-bottom:0;padding-bottom:0;border-bottom:none;">Recent Transactions</div>
    <div class="refresh-ind"><span class="refresh-dot"></span>Auto-refresh 10s</div>
  </div>

  <p class="mp-empty" id="mp-empty">Waiting for mempool data&hellip;</p>
  <table class="mp-table" id="mp-table" style="display:none;">
    <thead>
      <tr>
        <th>TxID</th>
        <th>In</th>
        <th>Out</th>
        <th>Fee</th>
        <th>Meta</th>
        <th>Size</th>
        <th>Age</th>
      </tr>
    </thead>
    <tbody id="mp-tbody"></tbody>
  </table>

  <div class="ft">
    <p>tsunagi.tech &middot; Mempool Observatory</p>
  </div>

</div>

<script>
(function(){
  var timer = null;

  function formatFee(f) {
    if (f === null || f === undefined) return '\u2014';
    return (f / 1000000).toFixed(6) + ' ADA';
  }

  function formatAge(ts) {
    if (!ts) return '\u2014';
    var d;
    try { d = new Date(ts); } catch(e) { return '\u2014'; }
    var sec = Math.floor((Date.now() - d.getTime()) / 1000);
    if (sec < 0) sec = 0;
    if (sec < 60) return sec + 's';
    if (sec < 3600) return Math.floor(sec/60) + 'm';
    if (sec < 86400) return Math.floor(sec/3600) + 'h';
    return Math.floor(sec/86400) + 'd';
  }

  function truncTxid(txid) {
    if (!txid || txid.length < 16) return txid || '\u2014';
    return txid.substring(0,8) + '\u2026' + txid.substring(txid.length - 8);
  }

  function update() {
    fetch('/data/mempool.json?_=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      document.getElementById('mp-total').textContent = d.tx_count != null ? d.tx_count : '\u2014';
      document.getElementById('mp-net').textContent = d.network || '\u2014';

      var recent = d.recent || [];
      if (recent.length > 0 && recent[0].timestamp) {
        document.getElementById('mp-last').textContent = formatAge(recent[0].timestamp);
      } else {
        document.getElementById('mp-last').textContent = '\u2014';
      }

      var table = document.getElementById('mp-table');
      var empty = document.getElementById('mp-empty');
      var tbody = document.getElementById('mp-tbody');

      if (recent.length === 0) {
        table.style.display = 'none';
        empty.style.display = 'block';
        return;
      }

      table.style.display = 'table';
      empty.style.display = 'none';
      tbody.innerHTML = '';

      for (var i = 0; i < recent.length; i++) {
        var tx = recent[i];
        var tr = document.createElement('tr');
        tr.innerHTML =
          '<td>' + truncTxid(tx.txid) + '</td>' +
          '<td>' + (tx.inputs != null ? tx.inputs : '\u2014') + '</td>' +
          '<td>' + (tx.outputs != null ? tx.outputs : '\u2014') + '</td>' +
          '<td>' + formatFee(tx.fee) + '</td>' +
          '<td class="' + (tx.metadata ? 'mp-meta-y' : 'mp-meta-n') + '">' + (tx.metadata ? 'yes' : 'no') + '</td>' +
          '<td>' + (tx.size != null ? tx.size + 'B' : '\u2014') + '</td>' +
          '<td>' + formatAge(tx.timestamp) + '</td>';
        tbody.appendChild(tr);
      }
    })
    .catch(function(){});
  }

  update();
  timer = setInterval(update, 10000);
})();
</script>

</body>
</html>
